<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subcontractor Coding</title>
<style>
:root{--navy:#1F3864;--navy2:#2F5597;--gold:#BF8F00;--line:#DDE2EA;--bg:#F3F5F9;--txt:#1d2433;--mut:#6b7280;--ok:#E2EFDA;--okT:#2e6b1f;--part:#FFF2CC;--partT:#8a6500;--not:#FCE4D6;--notT:#a33a00;--sel:#DCE9F9;--code:#EEF3FB;--codeB:#C9D6EA;--miss:#FFF0E8;--missB:#F2B79A}
*{box-sizing:border-box}
body{margin:0;font:13px/1.35 "Segoe UI",Arial,sans-serif;color:var(--txt);background:var(--bg);height:100vh;display:flex;flex-direction:column}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 10px;color:var(--txt)}
button:hover{border-color:var(--navy2)} button.pri{background:var(--navy);color:#fff;border-color:var(--navy)} button:disabled{opacity:.45;cursor:default}
input,select{font:inherit}
header.top{background:var(--navy);color:#fff;padding:8px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header.top h1{font-size:17px;margin:0;font-weight:600} .sub{opacity:.75;font-size:12px}
.sp{flex:1} header.top button{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)} header.top button:hover{border-color:#fff}
.tabs{display:flex;gap:4px;margin-left:18px} .tabs button{border-radius:6px 6px 0 0;border-bottom:0;padding:7px 16px;font-weight:600}
.tabs button.on{background:#fff;color:var(--navy);border-color:#fff}
#saved{font-size:11px;opacity:.8}
.kpis{display:flex;gap:10px;padding:8px 16px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
.kpi{background:var(--bg);border-radius:8px;padding:6px 14px;min-width:140px;border:1px solid var(--line)}
.kpi b{display:block;font-size:19px;color:var(--navy)} .kpi span{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.03em}
.kpi .bar{height:5px;background:#e5e7eb;border-radius:3px;margin-top:5px;overflow:hidden} .kpi .bar i{display:block;height:100%;background:#4c9a2a}
main{flex:1;display:flex;min-height:0}
aside{width:260px;background:#fff;border-right:1px solid var(--line);overflow:auto;padding:8px 10px}
aside h3{font-size:11px;text-transform:uppercase;color:var(--mut);margin:10px 4px 6px;letter-spacing:.04em}
.tow{display:block;width:100%;text-align:right;border:1px solid transparent;border-radius:6px;padding:6px 8px 6px 8px;margin:1px 0;background:none;border-left:5px solid var(--c)}
.tow.on{background:var(--sel);border-color:var(--navy2);border-left-color:var(--c)} .tow:hover{background:#eef2f8}
.tow .n{float:left;color:var(--mut);font-size:11px;direction:ltr} .tow .pb{height:3px;background:#e5e7eb;border-radius:2px;margin-top:4px} .tow .pb i{display:block;height:100%;background:#4c9a2a;border-radius:2px}
.pk{display:flex;justify-content:space-between;padding:4px 8px;border-radius:5px;font-size:12px;border-bottom:1px solid #f0f2f5} .pk b{font-weight:600}
section{flex:1;display:flex;flex-direction:column;min-width:0}
.tools{display:flex;gap:8px;align-items:center;padding:7px 12px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tools input[type=search]{width:260px;padding:5px 10px;border:1px solid var(--line);border-radius:6px}
.chip{border-radius:14px;padding:3px 10px;font-size:12px} .chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.bulk{display:none;gap:8px;align-items:center;padding:7px 12px;background:#EAF1FB;border-bottom:1px solid #b9cce8;flex-wrap:wrap}
.bulk.show{display:flex} .bulk b{color:var(--navy)}
.bulk input{width:96px;padding:4px 7px;border:1px solid var(--codeB);border-radius:5px;background:#fff}
.wrap{flex:1;overflow:auto;background:#fff}
table{border-collapse:separate;border-spacing:0;table-layout:fixed;width:max-content;min-width:100%}
th{position:sticky;top:0;background:var(--navy);color:#fff;font-weight:600;font-size:12px;padding:6px 24px 6px 8px;text-overflow:ellipsis;text-align:left;z-index:3;white-space:nowrap;border-right:1px solid #33497a;overflow:hidden}
th.code{background:var(--gold);border-right-color:#a67c00} th.num{text-align:right}
th .fb{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:4px;padding:0 5px;font-size:11px;line-height:17px}
th .fb.act{background:#FFD966;color:#000} th .sa{font-size:10px;opacity:.9}
td{border-bottom:1px solid var(--line);border-right:1px solid #eef0f4;padding:3px 7px;white-space:nowrap;vertical-align:middle;overflow:hidden;text-overflow:ellipsis}
tr.grp td{background:var(--gc);font-weight:600;color:#1d2433;border-top:2px solid var(--navy);padding:5px 8px;cursor:pointer;border-right:0}
tr.grp .tg{display:inline-block;width:16px;font-weight:700;color:var(--navy)} tr.grp .gm{font-weight:400;color:#444;margin-left:8px}
tr.grp .gb{display:inline-block;width:80px;height:6px;background:rgba(255,255,255,.7);border-radius:3px;vertical-align:middle;margin-left:8px;overflow:hidden} tr.grp .gb i{display:block;height:100%;background:#4c9a2a}
tr.it td:first-child{border-left:5px solid var(--gc)}
tr.it:hover td{background:#f7f9fc} tr.it.sel td{background:var(--sel)} tr.it.exc td{color:#a6a6a6;text-decoration:line-through}
td.num{text-align:right;font-variant-numeric:tabular-nums}
td.c{padding:2px 4px} td.c input{width:100%;border:1px solid var(--codeB);background:var(--code);border-radius:4px;padding:2px 5px;font-weight:600;color:var(--navy)}
td.c input:focus{outline:2px solid var(--navy2);background:#fff} td.c input.miss{background:var(--miss);border-color:var(--missB)} td.c input.typo{outline:2px solid #e8590c}
.st{border-radius:10px;padding:1px 8px;font-size:11px;font-weight:600}
.st.Coded{background:var(--ok);color:var(--okT)} .st.Partly{background:var(--part);color:var(--partT)} .st.Not{background:var(--not);color:var(--notT)}
.u{border-radius:4px;padding:0 6px;font-size:11px;font-weight:600;color:#1d2433}
.inc{border:0;background:none;font-size:12px;padding:1px 6px;border-radius:4px} .inc.no{background:#eee;color:#888}
a.lk{color:var(--navy2);font-weight:600;text-decoration:none} a.lk:hover{text-decoration:underline}
#pop{position:fixed;z-index:30;background:#fff;border:1px solid #c9d0db;border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.18);width:260px;display:none;padding:8px;font-size:12px}
#pop.show{display:block} #pop .row{display:flex;gap:6px;margin-bottom:6px} #pop .row button{flex:1}
#pop input[type=search],#pop input[type=number]{width:100%;padding:4px 7px;border:1px solid var(--line);border-radius:5px}
#pop .vals{max-height:230px;overflow:auto;border:1px solid var(--line);border-radius:5px;padding:4px 6px;margin:6px 0} #pop .vals label{display:flex;gap:6px;padding:2px 0;white-space:nowrap;overflow:hidden} #pop .vals .cn{color:var(--mut);margin-left:auto}
#drawer{position:fixed;right:0;top:0;bottom:0;width:440px;background:#fff;box-shadow:-6px 0 24px rgba(0,0,0,.15);transform:translateX(105%);transition:transform .2s;z-index:10;display:flex;flex-direction:column}
#drawer.open{transform:none} #drawer header{background:var(--navy2);color:#fff;padding:10px 14px;display:flex;gap:10px;align-items:center} #drawer header h1{font-size:16px;margin:0} #drawer header button{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}
#drawer .body{padding:12px 16px;overflow:auto}
.bars{display:flex;align-items:flex-end;gap:4px;height:120px;margin:10px 0 4px;border-bottom:1px solid var(--line)}
.bars div{flex:1;background:var(--navy2);border-radius:3px 3px 0 0;min-height:1px} .bars div.cut{background:var(--gold)}
.blab{display:flex;gap:4px;font-size:9px;color:var(--mut)} .blab span{flex:1;text-align:center;overflow:hidden}
dl{display:grid;grid-template-columns:120px 1fr;gap:5px 10px;margin:12px 0} dt{color:var(--mut)} dd{margin:0}
.mini{width:100%;border-collapse:collapse;table-layout:auto;min-width:0} .mini td,.mini th{position:static;border:1px solid var(--line);padding:3px 6px;font-size:12px} .mini th{background:#eef2f8;color:#1d2433}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1d2433;color:#fff;padding:9px 16px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40;max-width:80vw}
#toast.show{opacity:.95}
.help{font-size:11px;color:var(--mut)} kbd{background:#f1f3f6;border:1px solid #d6d9de;border-radius:3px;padding:0 4px;font-size:10px}
</style>
</head>
<body>
<header class="top">
  <div><h1>Subcontractor Coding</h1><div class="sub" id="hsub"></div></div>
  <div class="tabs"><button data-v="svc" class="on">Services</button><button data-v="po">PO view</button></div>
  <div class="sp"></div>
  <button id="bUndo" title="Ctrl+Z">↶ Undo</button><button id="bRedo" title="Ctrl+Y">↷ Redo</button>
  <button id="bImport" title="Read codes from the register Excel, your SC report, or a saved codes file">⇪ Import codes…</button>
  <button id="bSave" title="Save the codes as a small file you can open again">💾 Save codes</button>
  <button id="bExport" title="Formatted Excel with the codes (Coding + PO view) – give it to the register build as last report">⇩ Export to Excel</button>
  <span id="saved"></span>
  <input type="file" id="file" accept=".xlsx,.xlsm,.json" hidden>
</header>
<div class="kpis" id="kpis"></div>
<main>
  <aside><h3>Type of works</h3><div id="tows"></div><h3>Totals by PKG (to date)</h3><div id="pkgs"></div>
    <h3>Keys</h3><div class="help" style="padding:0 4px"><kbd>/</kbd> search · <kbd>Ctrl</kbd>+<kbd>Z</kbd>/<kbd>Y</kbd> undo/redo · <kbd>Shift</kbd>+click a range · <kbd>Enter</kbd> next row · <kbd>Esc</kbd> clear · ▾ in a header filters like Excel · click a group bar to fold it</div></aside>
  <section>
    <div class="tools">
      <input type="search" id="q" placeholder="Search…  ( / )">
      <span id="chips"></span>
      <label class="help"><input type="checkbox" id="showExc" checked> show excluded</label>
      <button id="bFold">− Collapse all</button><button id="bOpen">+ Expand all</button><button id="bClr">✕ Clear filters</button>
      <span class="help" id="cnt"></span>
    </div>
    <div class="bulk" id="bulk"><b id="bsel"></b>
      <span>DIV</span><input id="bDIV" list="lDIV"><span>PKG</span><input id="bPKG" list="lPKG"><span>MNL</span><input id="bMNL" list="lMNL"><span>Cost element</span><input id="bCE" list="lCE">
      <button class="pri" id="bApply">Apply to selected</button><button id="bClear">Clear codes</button><button id="bInc">Include</button><button id="bExc">Exclude</button><button id="bNone">✕ Clear selection</button>
      <span class="help">empty box = leave as is</span></div>
    <div class="wrap" id="wrap"><table id="tbl"><colgroup id="cg"></colgroup><thead id="th"></thead><tbody id="tb"></tbody></table></div>
  </section>
</main>
<div id="pop"></div>
<div id="drawer"><header><div><h1 id="dTitle"></h1><div class="sub" id="dSub"></div></div><div class="sp"></div><button id="dClose">✕</button></header><div class="body" id="dBody"></div></div>
<div id="toast"></div>
<datalist id="lDIV"></datalist><datalist id="lPKG"></datalist><datalist id="lMNL"></datalist><datalist id="lCE"></datalist>

<script>/*__DATA__*/</script>
<script>
'use strict';
const F = ['div', 'pkg', 'mnl', 'ce'], FN = { div: 'DIV', pkg: 'PKG', mnl: 'MNL', ce: 'Cost element' }, LID = { div: 'lDIV', pkg: 'lPKG', mnl: 'lMNL', ce: 'lCE' };
const DIVS = ['DIV 03', 'DIV 0302', 'DIV 04', 'DIV 05', 'DIV 06', 'DIV 07', 'DIV 08', 'DIV 09', 'DIV 10', 'DIV 21', 'DIV 22', 'DIV 23', 'DIV 26', 'DIV 27', 'DIV 31', 'DIV 32', 'DIV 33', 'INDIRECT'];
const MNLS = ['MAT', 'SUB', 'LAB', 'EQU', 'OTHER'];
const $ = (id) => document.getElementById(id), esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const fmt = (v) => (Math.abs(v) < 0.5 ? '-' : Math.round(v).toLocaleString('en-US')), fmtM = (v) => (Math.abs(v) >= 1e6 ? (v / 1e6).toFixed(1) + 'M' : fmt(v)), fq = (v) => (v ? v.toLocaleString('en-US', { maximumFractionDigits: 2 }) : '-');
const LSK = 'sc-coding:' + META.project;
ITEMS.forEach((it, i) => { it.i = i; });
const statusOf = (it) => { const n = F.filter((f) => it[f]).length; return n === 4 ? 'Coded' : n === 0 ? 'Not coded' : 'Partly coded'; };
// ---------- colours: Type of works (order of appearance) and units
const TOWC = ['#CFE2F3', '#F4D6E2', '#D9EAD3', '#FCE5CD', '#E1D5F0', '#D0F0EA', '#F9E2C7', '#E6E0C8', '#D6E4F7', '#F2D5D0', '#DDEFC6', '#EAD7F2', '#CDEFF5', '#F7EBC1', '#E3E3E3'];
const towList = [...new Set(ITEMS.map((x) => x.tow))], towCol = (t) => TOWC[Math.max(0, towList.indexOf(t)) % TOWC.length];
const UNC = ['#C9DAF8', '#D9EAD3', '#FCE5CD', '#EAD1DC', '#D0E0E3', '#FFF2CC', '#D9D2E9', '#F4CCCC', '#CFE2F3', '#E6D3C3'];
const unitList = [...new Set(ITEMS.map((x) => x.unit).filter(Boolean))].sort(), unitCol = (u) => UNC[Math.max(0, unitList.indexOf(u)) % UNC.length];
// ---------- state, undo/redo, autosave
let undo = [], redo = [], sel = new Set(), lastClick = null, view = 'svc';
const V = { svc: { q: '', st: 'All', exc: true, tow: '', f: {}, sort: null, fold: new Set() }, po: { q: '', st: 'All', exc: true, tow: '', f: {}, sort: null, fold: new Set() } };
function change(list, label) {
  const rec = list.map(({ i, f, v }) => ({ i, f, old: ITEMS[i][f], v })).filter((c) => c.old !== c.v); if (!rec.length) return;
  rec.forEach((c) => { ITEMS[c.i][c.f] = c.v; }); undo.push({ rec, label }); redo = []; persist(); render(); toast(label + ' · ' + rec.length + ' change' + (rec.length > 1 ? 's' : ''));
}
function doUndo() { const u = undo.pop(); if (!u) return; u.rec.forEach((c) => { ITEMS[c.i][c.f] = c.old; }); redo.push(u); persist(); render(); toast('Undone: ' + u.label); }
function doRedo() { const u = redo.pop(); if (!u) return; u.rec.forEach((c) => { ITEMS[c.i][c.f] = c.v; }); undo.push(u); persist(); render(); toast('Redone: ' + u.label); }
function codesObj() { const o = {}; ITEMS.forEach((it) => { o[it.key] = { div: it.div, pkg: it.pkg, mnl: it.mnl, ce: it.ce, inc: it.inc }; }); return o; }
function persist() { try { localStorage.setItem(LSK, JSON.stringify({ at: new Date().toISOString(), codes: codesObj() })); $('saved').textContent = 'Saved in this browser ' + new Date().toLocaleTimeString(); } catch (e) { $('saved').textContent = 'Not saved – use Save codes'; } }
function restore() { try { const s = JSON.parse(localStorage.getItem(LSK) || 'null'); if (!s) return; ITEMS.forEach((it) => { const c = s.codes[it.key]; if (c) F.concat('inc').forEach((f) => { if (c[f] !== undefined) it[f] = c[f]; }); }); $('saved').textContent = 'Restored ' + new Date(s.at).toLocaleString(); } catch (e) {} }
let tt; function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2800); }
// ---------- code lists + typo hints
const lev1 = (a, b) => { a = a.toUpperCase(); b = b.toUpperCase(); if (a === b) return true; if (Math.abs(a.length - b.length) > 1) return false; let i = 0; while (i < a.length && a[i] === b[i]) i++; return a.slice(i + 1) === b.slice(i + 1) || a.slice(i) === b.slice(i + 1) || a.slice(i + 1) === b.slice(i); };
let USE = {}; function countUse() { USE = { div: {}, pkg: {}, mnl: {}, ce: {} }; ITEMS.forEach((it) => F.forEach((f) => { if (it[f]) USE[f][it[f]] = (USE[f][it[f]] || 0) + 1; })); }
const typoOf = (f, v) => { if (!v || (USE[f][v] || 0) > 1 || (f === 'div' && DIVS.includes(v)) || (f === 'mnl' && MNLS.includes(v))) return ''; const near = Object.keys(USE[f]).find((k) => k !== v && USE[f][k] > 1 && lev1(k, v)); return near ? 'Did you mean ' + near + '?' : ''; };
// ---------- columns (shared by both views; a row is {it, po?, l?})
const codeCell = (f) => (r) => { const it = r.it, ty = typoOf(f, it[f]); return `<td class="c"><input data-f="${f}" value="${esc(it[f])}" list="${LID[f]}" class="${it[f] ? '' : 'miss'}${ty ? ' typo' : ''}" title="${esc(ty)}"></td>`; };
const COLS = {
  svc: [
    { k: 'svc', l: 'Service', w: 96, v: (r) => r.it.svc, h: (r) => `<td><a href="#" class="lk open">${esc(r.it.svc)}</a></td>` },
    { k: 'desc', l: 'Description', w: 330, v: (r) => r.it.desc, h: (r) => `<td dir="auto" title="${esc(r.it.desc)}">${esc(r.it.desc)}</td>` },
    { k: 'unit', l: 'Unit', w: 58, v: (r) => r.it.unit, h: (r) => `<td>${r.it.unit ? `<span class="u" style="background:${unitCol(r.it.unit)}">${esc(r.it.unit)}</span>` : ''}</td>` },
    ...F.map((f) => ({ k: f, l: FN[f], w: f === 'ce' ? 100 : f === 'div' ? 88 : f === 'mnl' ? 66 : 80, code: 1, v: (r) => r.it[f] || '(blank)', h: codeCell(f) })),
    { k: 'st', l: 'Status', w: 100, v: (r) => statusOf(r.it), h: (r) => { const s = statusOf(r.it); return `<td><span class="st ${s.split(' ')[0]}">${s}</span></td>`; } },
    { k: 'inc', l: 'Include', w: 64, v: (r) => r.it.inc, h: (r) => `<td><button class="inc ${r.it.inc === 'No' ? 'no' : ''}">${r.it.inc === 'No' ? 'No' : 'Yes'}</button></td>` },
    { k: 'qty', l: 'Qty to date', w: 96, num: 1, v: (r) => r.it.qty, h: (r) => `<td class="num">${fq(r.it.qty)}</td>` },
    { k: 'rate', l: 'Rate', w: 80, num: 1, v: (r) => (r.it.qty ? r.it.td / r.it.qty : 0), h: (r) => `<td class="num">${r.it.qty ? fmt(r.it.td / r.it.qty) : ''}</td>` },
    { k: 'td', l: 'To date', w: 112, num: 1, v: (r) => r.it.td, h: (r) => `<td class="num"><b>${fmt(r.it.td)}</b></td>` },
    { k: 'tm', l: 'This month', w: 104, num: 1, v: (r) => r.it.tm, h: (r) => `<td class="num">${fmt(r.it.tm)}</td>` },
    { k: 'pos', l: 'POs', w: 120, multi: 1, v: (r) => (r.it.poList.length ? r.it.poList : ['(none)']), h: (r) => `<td title="${esc(r.it.poTxt)}">${esc(r.it.poList[0] || '')}${r.it.poList.length > 1 ? ` <span class="help">+${r.it.poList.length - 1}</span>` : ''}</td>` },
    { k: 'subs', l: 'Subcontractors', w: 230, v: (r) => r.it.subs, h: (r) => `<td dir="auto" title="${esc(r.it.subs)}">${esc(r.it.subs)}</td>` },
  ],
  po: [
    { k: 'po', l: 'PO', w: 96, v: (r) => r.p.po, h: (r) => `<td class="help">${esc(r.p.po)}</td>` },
    { k: 'sup', l: 'Subcontractor', w: 150, v: (r) => r.p.sup, h: (r) => `<td dir="auto" class="help" title="${esc(r.p.sup)}">${esc(r.p.sup)}</td>` },
    { k: 'svc', l: 'Service', w: 96, v: (r) => r.it.svc, h: (r) => `<td><a href="#" class="lk open">${esc(r.it.svc)}</a></td>` },
    { k: 'desc', l: 'Description', w: 270, v: (r) => r.it.desc, h: (r) => `<td dir="auto" title="${esc(r.it.desc)}">${esc(r.it.desc)}</td>` },
    { k: 'unit', l: 'Unit', w: 58, v: (r) => r.it.unit, h: (r) => `<td>${r.it.unit ? `<span class="u" style="background:${unitCol(r.it.unit)}">${esc(r.it.unit)}</span>` : ''}</td>` },
    ...F.map((f) => ({ k: f, l: FN[f], w: f === 'ce' ? 100 : f === 'div' ? 88 : f === 'mnl' ? 66 : 80, code: 1, v: (r) => r.it[f] || '(blank)', h: codeCell(f) })),
    { k: 'st', l: 'Status', w: 100, v: (r) => statusOf(r.it), h: (r) => { const s = statusOf(r.it); return `<td><span class="st ${s.split(' ')[0]}">${s}</span></td>`; } },
    { k: 'qty', l: 'Qty (PO)', w: 92, num: 1, v: (r) => r.l.qty, h: (r) => `<td class="num">${fq(r.l.qty)}</td>` },

      wp.getCell(r, 12).fill = fill(stF[st]); wp.getCell(r, 13).numFmt = '#,##0.00'; wp.getCell(r, 14).numFmt = '#,##0;[Red]-#,##0;"-"'; wp.getCell(r, 15).numFmt = '#,##0;[Red]-#,##0;"-"'; wp.getRow(r).outlineLevel = 1; r++; }
