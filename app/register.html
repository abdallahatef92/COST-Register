.pkp{background:#fff;border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-height:0} .pkh{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)} .pkh b{color:var(--navy);font-size:13.5px}
