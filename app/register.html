<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cost Register</title>
<style>
:root{--navy:#1F3864;--navy2:#2F5597;--gold:#BF8F00;--line:#DDE2EA;--bg:#F3F5F9;--txt:#1d2433;--mut:#6b7280;--ok:#E2EFDA;--okT:#2e6b1f;--part:#FFF2CC;--partT:#8a6500;--not:#FCE4D6;--notT:#a33a00;--sel:#DCE9F9;--code:#EEF3FB;--codeB:#C9D6EA;--miss:#FFF0E8;--missB:#F2B79A;--ovr:#F8CBAD}
*{box-sizing:border-box}
body{margin:0;font:13px/1.35 "Segoe UI",Arial,sans-serif;color:var(--txt);background:var(--bg);height:100vh;display:flex;flex-direction:column}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 10px;color:var(--txt)}
button:hover{border-color:var(--navy2)} button.pri{background:var(--navy);color:#fff;border-color:var(--navy)} button:disabled{opacity:.45;cursor:default}
input,select{font:inherit}
header.top{background:var(--navy);color:#fff;padding:7px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header.top h1{font-size:17px;margin:0;font-weight:600} .sub{opacity:.75;font-size:11.5px}
.sp{flex:1} header.top button{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)} header.top button:hover{border-color:#fff}
header.top select,header.top input{background:#fff;border:0;border-radius:5px;padding:4px 6px;color:var(--txt)} header.top label{font-size:12px;opacity:.9}
nav.tabs{display:flex;gap:3px;background:var(--navy);padding:0 14px} nav.tabs button{border-radius:7px 7px 0 0;border:0;background:#2b4677;color:#dfe6f3;padding:7px 16px;font-weight:600}
nav.tabs button.on{background:var(--bg);color:var(--navy)}
#saved{font-size:11px;opacity:.8}
.page{flex:1;display:none;flex-direction:column;min-height:0} .page.on{display:flex}
.bar{display:flex;gap:8px;align-items:center;padding:7px 12px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
.bar input[type=search]{width:240px;padding:5px 10px;border:1px solid var(--line);border-radius:6px}
.chip{border-radius:14px;padding:3px 10px;font-size:12px;white-space:nowrap} .chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip .pc{font-size:10px;opacity:.75;margin-left:4px}
.bulk{display:none;gap:8px;align-items:center;padding:7px 12px;background:#EAF1FB;border-bottom:1px solid #b9cce8;flex-wrap:wrap}
.bulk.show{display:flex} .bulk b{color:var(--navy)} .bulk input{width:96px;padding:4px 7px;border:1px solid var(--codeB);border-radius:5px;background:#fff}
.wrap{flex:1;overflow:auto;background:#fff;position:relative}
table.t{border-collapse:separate;border-spacing:0;table-layout:fixed;width:max-content;min-width:100%}
.t th{position:sticky;top:0;background:var(--navy);color:#fff;font-weight:600;font-size:12px;padding:6px 24px 6px 8px;text-align:left;z-index:3;white-space:nowrap;border-right:1px solid #33497a;overflow:hidden;text-overflow:ellipsis}
.t th.code{background:var(--gold);border-right-color:#a67c00} .t th.num{text-align:right} .t th.cut{background:var(--gold)} .t th.pend{background:#C55A11}
.t th{height:27px} .t thead tr.band th{background:#2B4677;text-align:center;padding:0 6px;font-size:11.5px;border-bottom:1px solid #4a6496} .t thead tr.band th.tog{cursor:pointer} .t thead tr.band th.tog:hover{background:#3b5a91}
.t thead tr.band th.q{background:#37558a} .t thead tr.band th.y{background:#24406E} .t thead tr.band th.blank{background:var(--navy)}
.t .fz{position:sticky;z-index:2} .t th.fz{z-index:5} .t td.fz{background:#fff} .t tr.it.sel td.fz{background:var(--sel)} .t tr.tot td.fz{background:var(--navy)}
.t tr.grp td .gl{position:sticky;left:8px;display:inline-block} .t tr.grp td{overflow:visible}
.t th .fb{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:4px;padding:0 5px;font-size:11px;line-height:17px}
.t th .fb.act{background:#FFD966;color:#000} .t th .sa{font-size:10px}
.t td input[type=checkbox]{margin:0;vertical-align:middle} .t td{border-bottom:1px solid var(--line);border-right:1px solid #eef0f4;padding:0 7px;white-space:nowrap;vertical-align:middle;overflow:hidden;text-overflow:ellipsis;height:27px;max-height:27px}
.t tbody tr{height:27px}
.t tr.grp td{background:var(--gc);font-weight:600;border-top:2px solid var(--navy);padding:0 8px;cursor:pointer}
.t tr.grp .tg{display:inline-block;width:16px;font-weight:700;color:var(--navy)} .t tr.grp .gm{font-weight:400;color:#444;margin-left:8px}
.t tr.it td:first-child{border-left:5px solid var(--gc,#fff)} .t tr.it:hover td{background:#f7f9fc} .t tr.it.sel td{background:var(--sel)} .t tr.it.exc td{color:#a6a6a6;text-decoration:line-through}
.t tr.tot td{background:var(--navy);color:#fff;font-weight:700;position:sticky;bottom:0}
.t td.num{text-align:right;font-variant-numeric:tabular-nums} .t td.cutc{background:#FFF8E1} .t td.after{color:#c0c4cc}
.t td.c{padding:0 4px} .t td.c input{width:100%;height:21px;border:1px solid var(--codeB);background:var(--code);border-radius:4px;padding:0 5px;font-weight:600;color:var(--navy);font-size:12px}
.t td.c input:focus{outline:2px solid var(--navy2);background:#fff} .t td.c input.miss{background:var(--miss);border-color:var(--missB)} .t td.c input.ovr{background:var(--ovr);border-color:#e09a72;color:#8a3500}
.st{border-radius:10px;padding:1px 8px;font-size:11px;font-weight:600} .st.Fully{background:var(--ok);color:var(--okT)} .st.Partly{background:var(--part);color:var(--partT)} .st.Not{background:var(--not);color:var(--notT)}
.u{border-radius:4px;padding:0 6px;font-size:11px;font-weight:600}
.incb{border:0;background:none;font-size:12px;padding:0 6px;border-radius:4px;height:20px;line-height:20px} .incb.no{background:#eee;color:#888}
.rst{border:0;background:none;color:#c55a11;font-size:12px;padding:0 4px}
a.lk{color:var(--navy2);font-weight:600;text-decoration:none;cursor:pointer} a.lk:hover{text-decoration:underline}
.gb{display:inline-block;width:70px;height:6px;background:rgba(255,255,255,.75);border-radius:3px;vertical-align:middle;overflow:hidden;margin-left:6px} .gb i{display:block;height:100%;background:#4c9a2a}
/* summary */
.dash{flex:1;overflow:auto;padding:14px 16px}
.cards{display:grid;grid-template-columns:repeat(6,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px} .card span{font-size:10.5px;text-transform:uppercase;color:var(--mut);letter-spacing:.03em} .card b{display:block;font-size:21px;color:var(--navy);margin-top:2px}
.card.gold{background:#FFF8E1;border-color:#f0d58a} .card.red b{color:#c00000} .card.green b{color:#2e6b1f}
.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:14px} .panel h2{font-size:14px;margin:0 0 8px;color:var(--navy)} .panel .note{font-size:11px;color:var(--mut);margin-left:8px;font-weight:400}
.grid2{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}
table.s{border-collapse:collapse;width:100%} .s th{background:var(--navy);color:#fff;padding:5px 8px;font-size:12px;text-align:right} .s th:first-child{text-align:left}
.s td{border-bottom:1px solid var(--line);padding:4px 8px;text-align:right;font-variant-numeric:tabular-nums} .s td:first-child{text-align:left} .s tr.tt td{background:#DDEBF7;font-weight:700} .s tr.cm td{background:#FFF8E1;font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;margin-top:6px} .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.okc{background:var(--ok);color:var(--okT);font-weight:700;border-radius:4px;padding:1px 8px} .chk{background:#FFC7CE;color:#9C0006;font-weight:700;border-radius:4px;padding:1px 8px} .inf{color:var(--mut)}
#pop{position:fixed;z-index:30;background:#fff;border:1px solid #c9d0db;border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.18);width:270px;display:none;padding:8px;font-size:12px}
#pop.show{display:block} #pop .row{display:flex;gap:6px;margin-bottom:6px} #pop .row button{flex:1} #pop input[type=search]{width:100%;padding:4px 7px;border:1px solid var(--line);border-radius:5px}
#pop .vals{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:5px;padding:4px 6px;margin:6px 0} #pop .vals label{display:flex;gap:6px;padding:2px 0;white-space:nowrap;overflow:hidden} #pop .vals .cn{color:var(--mut);margin-left:auto}
#drawer{position:fixed;right:0;top:0;bottom:0;width:460px;background:#fff;box-shadow:-6px 0 24px rgba(0,0,0,.15);transform:translateX(105%);transition:transform .2s;z-index:10;display:flex;flex-direction:column}
#drawer.open{transform:none} #drawer header{background:var(--navy2);color:#fff;padding:10px 14px;display:flex;gap:10px;align-items:center} #drawer header h1{font-size:15px;margin:0} #drawer header button{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}
#drawer .body{padding:12px 16px;overflow:auto}
.bars{display:flex;align-items:flex-end;gap:3px;height:120px;margin:10px 0 4px;border-bottom:1px solid var(--line)} .bars div{flex:1;background:var(--navy2);border-radius:3px 3px 0 0;min-height:1px} .bars div.cut{background:var(--gold)}
.blab{display:flex;gap:3px;font-size:9px;color:var(--mut)} .blab span{flex:1;text-align:center;overflow:hidden}
dl{display:grid;grid-template-columns:130px 1fr;gap:5px 10px;margin:12px 0} dt{color:var(--mut)} dd{margin:0}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1d2433;color:#fff;padding:9px 16px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40;max-width:80vw}
#toast.show{opacity:.95}
.help{font-size:11px;color:var(--mut)} kbd{background:#f1f3f6;border:1px solid #d6d9de;border-radius:3px;padding:0 4px;font-size:10px}
.start{position:fixed;inset:0;background:rgba(20,30,50,.55);z-index:50;align-items:center;justify-content:center}
.sbox{background:#fff;border-radius:12px;padding:22px 26px;width:min(760px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.3)} .sbox h1{margin:0 0 4px;color:var(--navy);font-size:20px}
.drop{border:2px dashed #9fb3d1;border-radius:10px;padding:18px;text-align:center;color:var(--mut);margin:12px 0} .drop.on{background:#EAF1FB;border-color:var(--navy2)}
.frow{display:grid;grid-template-columns:330px 1fr;gap:8px;align-items:center;padding:4px 0;border-bottom:1px solid #f0f2f5} .frow label{font-weight:600} .fn{grid-column:2;color:#2e6b1f;font-size:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden} .seg button{border:0;border-radius:0;padding:4px 10px} .seg button.on{background:var(--navy);color:#fff}
</style>
</head>
<body>
<div id="start" class="start" style="display:none"></div>
<header class="top">
  <div><h1>Cost Register</h1><div class="sub" id="hsub"></div></div>
  <div class="sp"></div>
  <label>Cut date <select id="cut"></select></label>
  <label>VAT <select id="vat"><option>Exclude VAT</option><option>Include VAT</option><option>Include VAT before date</option></select></label><input type="date" id="vatFrom" style="display:none">
  <button id="bNew" title="Build from new SAP files">⟳ New build</button><button id="bUndo" title="Ctrl+Z">↶</button><button id="bRedo" title="Ctrl+Y">↷</button>
  <button id="bImport" title="Read codes from a register Excel, your SC report, an exported report or a saved codes file">⇪ Import codes</button>
  <button id="bSave" title="Save all codes (and line overrides) as a small file">💾 Save codes</button>
  <button id="bExport" title="Light Excel report: values, formatted, cut date as now">⇩ Export Excel</button>
  <span id="saved"></span><input type="file" id="file" accept=".xlsx,.xlsm,.json" hidden>
</header>
<nav class="tabs" id="tabs"></nav>
<!-- Summary -->
<div class="page" id="pg-sum"><div class="dash" id="sum"></div></div>
<!-- Coding / Per Month / Lines / Expenses / Subcontractor: table pages -->
<div class="page" id="pg-tbl">
  <div class="bar" id="bkbar"></div>
  <div class="bar" id="tools"></div>
  <div class="bulk" id="bulk"><b id="bsel"></b><span id="bdiv">DIV <input id="bDIV" list="dl-div"></span>PKG <input id="bPKG" list="dl-pkg">MNL <input id="bMNL" list="dl-mnl">Cost element <input id="bCE" list="dl-ce">
    <button class="pri" id="bApply">Apply to selected</button><button id="bClear">Clear codes</button><button id="bInc">Include</button><button id="bExc">Exclude</button><button id="bNone">✕ Clear selection</button><span class="help">empty box = leave as is</span></div>
  <div class="wrap" id="wrap"><table class="t" id="tbl"><colgroup id="cg"></colgroup><thead id="th"></thead><tbody id="tb"></tbody><tfoot id="tf"></tfoot></table></div>
</div>
<!-- Checks -->
<div class="page" id="pg-chk"><div class="dash" id="chk"></div></div>
<div id="pop"></div>
<div id="drawer"><header><div><h1 id="dTitle"></h1><div class="sub" id="dSub"></div></div><div class="sp"></div><button id="dClose">✕</button></header><div class="body" id="dBody"></div></div>
<div id="toast"></div>
<datalist id="dl-div"></datalist><datalist id="dl-pkg"></datalist><datalist id="dl-mnl"></datalist><datalist id="dl-ce"></datalist>
<script>/*__XLSX__*/</script>
<script>/*__EXCELJS__*/</script>
<script>/*__ENGINE__*/</script>
<script>/*__DATA__*/</script>
<script>
'use strict';
function boot(DATA) {
document.getElementById('start').style.display = 'none';
// =====================================================================================  data + helpers
const { META, S, BK, L, REV, SUB } = DATA, N = L.b.length;
const PER = ['Opening', ...META.months, 'Pending'], NP = PER.length, NM = META.months.length;
const $ = (id) => document.getElementById(id), esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const fmt = (v) => (Math.abs(v) < 0.5 ? '-' : Math.round(v).toLocaleString('en-US')), fmt2 = (v) => (Math.abs(v) < 0.005 ? '-' : v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
const fmtM = (v) => (Math.abs(v) >= 1e6 ? (v / 1e6).toFixed(1) + 'M' : fmt(v)), fq = (v) => (Math.abs(v) < 1e-9 ? '-' : v.toLocaleString('en-US', { maximumFractionDigits: 3 })), pct = (a, b) => (b ? (100 * a / b).toFixed(1) + '%' : '-');
const r2 = (v) => Math.round(v * 100) / 100;
const SUBI = BK.findIndex((b) => b.id === 'Subcontractor'), MATI = BK.findIndex((b) => b.id === 'Material');
BK.forEach((b, bi) => b.items.forEach((it, ii) => { it.bi = bi; it.ii = ii; it.vals = it.v.map((x) => S[x]); it.grp = S[it.g] || ''; }));
const isSub = (bi) => bi === SUBI, codeF = (bi) => (isSub(bi) ? ['div', 'pkg', 'mnl', 'ce'] : ['pkg', 'mnl', 'ce']), FN = { div: 'DIV', pkg: 'PKG', mnl: 'MNL', ce: 'Cost element' };
const itemCode = (it) => (it.bi === MATI ? it.vals[3] : isSub(it.bi) ? it.vals[1] : it.bi === BK.findIndex((b) => b.id === 'G&A') ? it.vals[0] + ' · ' + it.vals[1] : it.vals[0]);
const itemDesc = (it) => (it.bi === MATI ? it.vals[4] : isSub(it.bi) ? it.vals[2] : it.vals.length > 1 && it.bi !== BK.findIndex((b) => b.id === 'G&A') ? it.vals[1] : '');
const itemUnit = (it) => (it.bi === MATI ? it.vals[5] : isSub(it.bi) ? it.vals[3] : '');
const statusOf = (it) => { if (isSub(it.bi)) { const n = ['div', 'pkg', 'mnl', 'ce'].filter((f) => it[f]).length; return n === 4 ? 'Fully coded' : n === 0 ? 'Not coded' : 'Partly coded'; } return it.pkg && it.mnl && it.ce ? 'Fully coded' : it.pkg || it.ce ? 'Partly coded' : 'Not coded'; };
const PAL = ['#5B8DD6', '#E39B5B', '#6BAF6B', '#B37FCF', '#D8C24A', '#4FB3B3', '#E07A8F', '#8C9BB0', '#A4836A', '#77A8D6', '#C7A0E0', '#9DC183'];
const SOFT = ['#CFE2F3', '#F4D6E2', '#D9EAD3', '#FCE5CD', '#E1D5F0', '#D0F0EA', '#F9E2C7', '#E6E0C8', '#D6E4F7', '#F2D5D0', '#DDEFC6', '#EAD7F2', '#CDEFF5', '#F7EBC1', '#E3E3E3'];
const grpCols = new Map(); const grpCol = (k) => { if (!grpCols.has(k)) grpCols.set(k, SOFT[grpCols.size % SOFT.length]); return grpCols.get(k); };
const UNC = ['#C9DAF8', '#D9EAD3', '#FCE5CD', '#EAD1DC', '#D0E0E3', '#FFF2CC', '#D9D2E9', '#F4CCCC', '#CFE2F3', '#E6D3C3'], unitCols = new Map(); const unitCol = (u) => { if (!unitCols.has(u)) unitCols.set(u, UNC[unitCols.size % UNC.length]); return unitCols.get(u); };
let tt; function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 3000); }
// =====================================================================================  state: cut date, VAT, codes, line overrides, undo
const LSK = 'cost-register:' + META.project + ':' + (META.buildId || META.built), OVR = Object.assign({}, L.ovr);
const ST = { cut: META.cut, vat: META.vat.mode || 'Exclude VAT', vatFrom: META.vat.from || '', tab: 'sum', bk: Math.max(0, MATI), sub: 'po', pmMode: 'Amount' };
let undo = [], redo = [];
// a change: {t:'item', bi, ii, f, v} or {t:'line', i, f, v}  (v undefined = remove override)
function getC(c) { if (c.t === 'item') return BK[c.bi].items[c.ii][c.f]; const o = OVR[L.id[c.i]]; return o ? o[c.f] : undefined; }
function setC(c, v) { if (c.t === 'item') { BK[c.bi].items[c.ii][c.f] = v; return; } const id = L.id[c.i]; const o = OVR[id] || (OVR[id] = {}); if (v === undefined || v === null) delete o[c.f]; else o[c.f] = v; if (!Object.keys(o).length) delete OVR[id]; }
function change(list, label) { const rec = list.map((c) => ({ ...c, old: getC(c) })).filter((c) => c.old !== c.v); if (!rec.length) return; rec.forEach((c) => setC(c, c.v)); undo.push({ rec, label }); redo = []; after(label + ' · ' + rec.length + ' change' + (rec.length > 1 ? 's' : '')); }
function doUndo() { const u = undo.pop(); if (!u) return; u.rec.forEach((c) => setC(c, c.old)); redo.push(u); after('Undone: ' + u.label); }
function doRedo() { const u = redo.pop(); if (!u) return; u.rec.forEach((c) => setC(c, c.v)); undo.push(u); after('Redone: ' + u.label); }
function after(msg) { persist(); compute(); render(); if (msg) toast(msg); }
function snapshot() { const codes = {}; BK.forEach((b) => { codes[b.id] = {}; b.items.forEach((it) => { codes[b.id][it.k] = { pkg: it.pkg, mnl: it.mnl, ce: it.ce, inc: it.inc, ...(isSub(it.bi) ? { div: it.div } : {}) }; }); }); return { project: META.project, cut: ST.cut, vat: ST.vat, vatFrom: ST.vatFrom, at: new Date().toISOString(), codes, lines: OVR }; }
function persist() { try { localStorage.setItem(LSK, JSON.stringify(snapshot())); $('saved').textContent = 'Saved in this browser ' + new Date().toLocaleTimeString(); } catch (e) { $('saved').textContent = 'Not saved here – use Save codes'; } }
function applySnap(s, replaceLines) { let n = 0; BK.forEach((b) => { const m = s.codes && s.codes[b.id]; if (!m) return; b.items.forEach((it) => { const c = m[it.k]; if (!c) return; n++; ['pkg', 'mnl', 'ce', 'inc', 'div'].forEach((f) => { if (c[f] !== undefined && (f !== 'div' || isSub(it.bi))) it[f] = c[f]; }); }); });
  if (s.lines && replaceLines) { for (const k of Object.keys(OVR)) delete OVR[k]; Object.assign(OVR, s.lines); } return n; }
function restore() { try { const s = JSON.parse(localStorage.getItem(LSK) || 'null'); if (!s) return; applySnap(s, true); if (s.cut && META.cuts.includes(s.cut)) ST.cut = s.cut; if (s.vat) { ST.vat = s.vat; ST.vatFrom = s.vatFrom || ''; } $('saved').textContent = 'Restored ' + new Date(s.at).toLocaleString(); } catch (e) {} }
// =====================================================================================  the engine: everything from the lines, the codes and the cut date (no formulas)
const R = {}; globalThis.R = R; globalThis.__BK = BK;   // results of compute() (also readable from the browser console)
const SRC = L.src.map((x) => S[x]);
function compute() {
  const cutI = +ST.cut.replace(/-/g, ''), fromI = ST.vatFrom ? +ST.vatFrom.replace(/-/g, '') : 0, rep = PER.indexOf(monLab(ST.cut));
  R.rep = rep; R.repLab = monLab(ST.cut); R.cutI = cutI;
  const per = R.per = new Int16Array(N), amt = R.amt = new Float64Array(N), vin = R.vin = new Float64Array(N);
  let openVin = 0, offRow = -1;
