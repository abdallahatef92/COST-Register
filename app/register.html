<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cost Register __VER__</title>
<style>
/*__CSS__*/
</style>
</head>
<body>
<div id="start" class="start" style="display:none"></div>
<header class="top">
  <div class="ttl"><h1>Cost Register <span class="ver" title="Tool version">__VER__</span></h1><div class="sub"><span id="hsub"></span> · to <select id="cut" title="Cut date – the month you are closing"></select></div></div>
  <button id="bHome" hidden title="Back to the coding work list">← Back to coding</button>
  <div id="hprog" title="Share of the to-date cost on fully coded items – click to carry on coding"></div>
  <div class="sp"></div>
  <span id="hasv"></span>
  <button id="bUndo" title="Undo (Ctrl+Z)">↶<span class="bl"> Undo</span></button><button id="bRedo" title="Redo (Ctrl+Y)">↷</button>
  <div class="mwrap"><button id="bMenu" title="Dashboard, subcontractor packages, adjustments, checks, reports, files">Dashboard &amp; reports ▾</button>
    <div id="menu" hidden>
      <nav class="secs" id="tabs"></nav>
      <div class="msep"></div>
      <label class="mrow">VAT on certificates <select id="vat" title="VAT on subcontractor certificates"><option>Exclude VAT</option><option>Include VAT</option><option>Include VAT before date</option></select><input type="date" id="vatFrom" style="display:none"></label>
      <div class="msep"></div>
      <button id="bImport" title="Read codes from a register Excel, your SC report, an exported report or a saved codes file">⇪ Import codes…</button>
      <button id="bSave" title="Save all codes (and line overrides) as a small file">💾 Save codes to a file</button>
      <button id="bNew" title="Build from new SAP files">⟳ New build from SAP files</button>
      <button id="bHelp" title="Show / hide the coding guide (Start here)">? Coding guide</button>
    </div></div>
  <button id="bExport" class="hp" title="Light Excel report: values, formatted, cut date as now">⇩ Export Excel</button>
  <input type="file" id="file" accept=".xlsx,.xlsm,.json" hidden><span id="saved" hidden></span>
</header>
<div id="mainrow"><aside id="side"></aside><div id="pages">
<!-- Summary -->
<div class="page" id="pg-sum"><div class="dash" id="sum"></div></div>
<!-- Coding / Per Month / Lines / Expenses / Subcontractor: table pages -->
<div class="page" id="pg-tbl">
  <div class="bar" id="bkbar"></div>
  <div class="bar" id="tools"></div>
  <div class="gs" id="guide" hidden></div>
  <div class="bulk" id="bulk"><b id="bsel"></b><span id="bdiv">DIV <input id="bDIV" list="dl-div"></span>PKG <input id="bPKG" list="dl-pkg">MNL <input id="bMNL" list="dl-mnl">Cost element <input id="bCE" list="dl-ce">
    <button class="pri" id="bApply">Apply to selected</button><button id="bClear">Clear codes</button><button id="bInc">Include</button><button id="bExc">Exclude</button><button id="bNone">✕ Clear selection</button><span class="help">empty box = leave as is</span></div>
  <div class="wrap" id="wrap"><table class="t" id="tbl"><colgroup id="cg"></colgroup><thead id="th"></thead><tbody id="tb"></tbody><tfoot id="tf"></tfoot></table></div>
</div>
<!-- Checks -->
<div class="page" id="pg-sov"><div id="sov" class="pkroot"></div></div>
<div class="page" id="pg-pkg"><div id="pkg" class="pkroot"></div></div>
<div class="page" id="pg-mr"><div id="mr" class="pkroot"></div></div>
<div class="page" id="pg-psum"><div class="dash" id="psum"></div></div>
<div class="page" id="pg-drv"><div class="dash" id="drvp"></div></div>
<div class="page" id="pg-log"><div class="dash" id="log"></div></div>
<div class="page" id="pg-chk"><div class="dash" id="chk"></div></div>
<div class="page" id="pg-rul"><div class="dash" id="rul"></div></div>
</div></div>
<footer id="sbar"></footer>
<div id="pop"></div><div id="cpop"></div>
<div id="drawer"><header><div><h1 id="dTitle"></h1><div class="sub" id="dSub"></div></div><div class="sp"></div><button id="dClose">✕</button></header><div class="body" id="dBody"></div></div>
<div id="toast"></div>
<datalist id="dl-div"></datalist><datalist id="dl-pkg"></datalist><datalist id="dl-mnl"></datalist><datalist id="dl-ce"></datalist>
<script>/*__XLSX__*/</script>
<script>/*__EXCELJS__*/</script>
<script>/*__ENGINE__*/</script>
<script>/*__DATA__*/</script>
<script>
/*__APP__*/
</script>
</body>
</html>
